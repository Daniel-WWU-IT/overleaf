services:
    sharelatex:
        restart: always
        image: sharelatex/sharelatex
        container_name: sharelatex
        depends_on:
            mongo:
                condition: service_healthy
            redis:
                condition: service_started
        ports:
            - "8099:80"
        links:
            - mongo
            - redis
        stop_grace_period: 60s
        volumes:
            - ./.data/sharelatex:/var/lib/sharelatex
        environment:
            SHARELATEX_SITE_URL: http://sharelatex

            SHARELATEX_APP_NAME: Overleaf Local

            SHARELATEX_MONGO_URL: mongodb://mongo/sharelatex

            SHARELATEX_REDIS_HOST: redis
            REDIS_HOST: redis

            ENABLED_LINKED_FILE_TYPES: 'project_file,project_output_file'
            ENABLE_CONVERSIONS: 'true'
            EMAIL_CONFIRMATION_DISABLED: 'true'
            TEXMFVAR: /var/lib/sharelatex/tmp/texmf-var

            SHARELATEX_SESSION_SECRET: 'iYmZUouDPl3zEahNVM0m5N2kavSsfQIT'
            REMOTE_API_KEY: 'F18KiFG6gStOav5UzdH9eIke7taCSqGx'
            REMOTE_API_ALLOWED_CLIENTS: '*'

            SERVICE_DEBUG_MODE: 'false'

            DEBUG_INFORMATION: 'true'

    mongo:
        restart: always
        image: mongo:4.4
        container_name: mongo
        command: mongod --quiet --logpath /dev/null
        expose:
            - 27017
        volumes:
            - ./.data/mongo:/data/db
        healthcheck:
            test: echo 'db.stats().ok' | mongo localhost:27017/test --quiet
            interval: 10s
            timeout: 10s
            retries: 5

    redis:
        restart: always
        image: redis:5
        container_name: redis
        expose:
            - 6379
        volumes:
            - ./.data/redis:/data

    nextcloud:
        image: nextcloud:31
        container_name: nextcloud
        expose:
            - "80"
        environment:
            - OVERWRITEPROTOCOL=https
            - OVERWRITEHOST=nextcloud.dev.local
            - NEXTCLOUD_ADMIN_USER=admin
            - NEXTCLOUD_ADMIN_PASSWORD=admin
            - OVERLEAF_INTERNAL_URL=http://sharelatex
        volumes:
            - nextcloud:/var/www/html
            - ./.data/custom_apps:/var/www/html/custom_apps
            - ../../overleaf-nextcloud:/var/www/html/custom_apps/overleaf_nextcloud

    proxy:
        image: nginx:alpine
        container_name: proxy
        ports:
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certs:/etc/nginx/certs:ro
        depends_on:
            - sharelatex
            - nextcloud

volumes:
    nextcloud:
        name: nextcloud
