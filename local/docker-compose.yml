# Local Overleaf+Nextcloud deployment
services:
    sharelatex:
        restart: always
        image: sharelatex/sharelatex:v6-beta
        container_name: sharelatex
        depends_on:
            mongo:
                condition: service_healthy
            redis:
                condition: service_started
        ports:
            - "8099:80"
        #links:
            #- mongo
            #- redis
        stop_grace_period: 60s
        volumes:
            - ./.data/overleaf:/var/lib/overleaf
        environment:
            OVERLEAF_SITE_URL: 'http://sharelatex'

            OVERLEAF_APP_NAME: 'Overleaf Local'

            OVERLEAF_MONGO_URL: 'mongodb://mongo/sharelatex'

            OVERLEAF_REDIS_HOST: 'redis'
            REDIS_HOST: 'redis'

            ENABLED_LINKED_FILE_TYPES: 'project_file,project_output_file'
            ENABLE_CONVERSIONS: 'true'
            EMAIL_CONFIRMATION_DISABLED: 'true'

            OVERLEAF_SESSION_SECRET: 'iYmZUouDPl3zEahNVM0m5N2kavSsfQIT'

            # Integration-specific settings
            REMOTE_API_KEY: 'F18KiFG6gStOav5UzdH9eIke7taCSqGx'
            REMOTE_API_ALLOWED_CLIENTS: '*'

            SERVICE_DEBUG_MODE: 'false'

            DEBUG_INFORMATION: 'true'

    mongo:
        restart: always
        image: mongo:8.2
        container_name: mongo
        command: "--replSet overleaf"
        volumes:
            - mongo:/data/db
            - ${PWD}/bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
        environment:
            MONGO_INITDB_DATABASE: sharelatex
        extra_hosts:
            - mongo:127.0.0.1
        healthcheck:
            test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
            interval: 10s
            timeout: 10s
            retries: 5

    redis:
        restart: always
        image: redis:7.4
        container_name: redis
        volumes:
            - redis:/data

    nextcloud:
        image: nextcloud:31
        container_name: nextcloud
        environment:
            OVERWRITEPROTOCOL: 'https'
            OVERWRITEHOST: 'nextcloud.dev.local'

            NEXTCLOUD_ADMIN_USER: 'admin'
            NEXTCLOUD_ADMIN_PASSWORD: 'admin'

            OVERLEAF_INTERNAL_URL: 'http://sharelatex'
        volumes:
            - nextcloud:/var/www/html
            - ./.data/custom_apps:/var/www/html/custom_apps
            - ../../overleaf-nextcloud:/var/www/html/custom_apps/overleaf_nextcloud

    proxy:
        image: nginx:alpine
        container_name: proxy
        ports:
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certs:/etc/nginx/certs:ro
        depends_on:
            - sharelatex
            - nextcloud

volumes:
    nextcloud:
        name: nextcloud
    mongo:
        name: mongo
    redis:
        name: redis
