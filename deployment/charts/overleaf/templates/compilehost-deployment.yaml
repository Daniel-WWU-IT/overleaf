apiVersion: apps/v1
kind: Deployment
metadata:
  name: overleaf-compile
  labels:
    app.kubernetes.io/instance: sciebo-overleaf-helm-app
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: overleaf
    app.kubernetes.io/component: compile
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: overleaf
      app.kubernetes.io/name: overleaf
      app.kubernetes.io/component: compile
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/instance: overleaf
        app.kubernetes.io/name: overleaf
        app.kubernetes.io/component: compile
    spec:
      imagePullSecrets:
        {{- range $secret := .Values.imagePullSecrets }}
        - name: {{ $secret.name }}
        {{- end }}
      automountServiceAccountToken: true
      containers:
      - name: overleaf-compilehost
        image: {{ quote (printf "%s:%s" .Values.compileHost.image.repository .Values.compileHost.image.tag) }}
        imagePullPolicy: {{ quote .Values.compileHost.image.pullPolicy }}
        env:
          - name: TEXLIVE_IMAGE
            value: {{ quote (printf "%s:%s" .Values.compileHost.texlive.repository .Values.compileHost.texlive.tag) }}
          - name: COMPILE_TIMEOUT
            value: {{ .Values.compileHost.timeout | default 180 | quote }}
          - name: REGISTRY_AUTH_FILE
            value: "/etc/containers/auth.json"
        resources: {}
        securityContext:
          readOnlyRootFilesystem: false
          privileged: true
        command:
          - bash
        args:
          - -c
          - |
            time podman run $TEXLIVE_IMAGE echo Finished prepull
            gunicorn -w 4 -b 0.0.0.0:6666 --access-logfile=- --error-logfile=- --timeout $COMPILE_TIMEOUT server:app
        ports:
        - containerPort: 6666
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: {{ quote .Values.persistence.mountPath }}
          name: data
        - mountPath: /var/lib/containers
          name: containers
        - name: harbor-pull-secret
          mountPath: "/etc/containers/auth.json"
          subPath: "auth.json"
          readOnly: true
      volumes:
        - name: data
{{- if .Values.persistence.persistentVolumeClaim }}
          persistentVolumeClaim:
            claimName: {{ quote .Values.persistence.persistentVolumeClaim }}
{{- else }}
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: Directory
{{- end }}
        - name: containers
          emptyDir:
            medium: Memory
        - name: harbor-pull-secret
          secret:
          {{- range $secret := .Values.imagePullSecrets }}
            secretName: {{ $secret.name }}
          {{- end }}
            items:
              - key: ".dockerconfigjson"
                path: "auth.json"
