{{ if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: overleaf
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://sns-staging.sciebo.de"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,POST,OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers "X-Frame-Options";
spec:
  tls:
    - hosts:
        - {{ quote .Values.hostURL }}
      secretName: {{ quote .Values.ingress.tls.secretName }}
  rules:
    - host: {{ quote .Values.hostURL }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: overleaf
                port:
                  number: 80
{{- end }}
