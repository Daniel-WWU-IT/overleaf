apiVersion: apps/v1
kind: Deployment
metadata:
  name: overleaf
  labels:
    app.kubernetes.io/instance: sciebo-overleaf-helm-app
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: overleaf
    app.kubernetes.io/component: frontend
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: overleaf
      app.kubernetes.io/name: overleaf
      app.kubernetes.io/component: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/instance: overleaf
        app.kubernetes.io/name: overleaf
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        {{- range $secret := .Values.imagePullSecrets }}
        - name: {{ $secret.name }}
        {{- end }}
      automountServiceAccountToken: true
      containers:
      - name: overleaf
        image: {{ quote (printf "%s:%s" .Values.image.repository .Values.image.tag) }}
        imagePullPolicy: {{ quote .Values.image.pullPolicy }}
        env:
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: {{ quote $v }}
        {{- end }}
        - name: "OVERLEAF_SITE_URL"
          value: "https://{{ .Values.hostURL }}"
        - name: "OVERLEAF_CSP_ENABLED"
          value: "false"
        - name: "OVERLEAF_RESTRICT_INVITES_TO_EXISTING_ACCOUNTS"
          value: "true"
        - name: "OVERLEAF_DISABLE_LINK_SHARING"
          value: "true"
        - name: "EMAIL_CONFIRMATION_DISABLED"
          value: "true"
        - name: "ENABLED_LINKED_FILE_TYPES"
          value: "project_file,project_output_file"
        - name: "OVERLEAF_ALLOW_ANONYMOUS_READ_AND_WRITE_SHARING"
          value: "false"
        - name: "OVERLEAF_ALLOW_PUBLIC_ACCESS"
          value: "false"
        - name: "TZ"
          value: "UTC"
        - name: "COMPILE_HOST"
          value: "{{ .Values.compileHost.url }}"
        - name: "COMPILE_TIMEOUT"
          value: {{ .Values.compileHost.timeout | default 180 | quote }}

        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: {{ quote .Values.persistence.mountPath }}
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 80
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 80
          timeoutSeconds: 1
        resources: {}
        startupProbe:
          failureThreshold: 30
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: 80
          timeoutSeconds: 1
      volumes:
        - name: data
{{- if .Values.persistence.persistentVolumeClaim }}
          persistentVolumeClaim:
            claimName: {{ quote .Values.persistence.persistentVolumeClaim }}
{{- else }}
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: Directory
{{- end }}
        - name: containers
          emptyDir:
            medium: Memory
        - name: harbor-pull-secret
          secret:
          {{- range $secret := .Values.imagePullSecrets }}
            secretName: {{ $secret.name }}
          {{- end }}
            items:
              - key: ".dockerconfigjson"
                path: "auth.json"
