image:
  tag: "8.3"
auth:
  enabled: true
  rootUsername: root
  rootPassword: root
replicaCount: 1
persistence:
  enabled: true
  storageClass: cephfs
  accessMode: ReadWriteMany
  size: 10Gi
resources:
  limits:
    memory: 4Gi
replicaSet:
  enabled: true
  name: overleaf
  key: "c2NpZWJvIHJvY2t0IQo="
  secondaries: 0
  extraInit:
    retries: 20
    delay: 10
customUsers:
  - name: sharelatex
    password: sharelatex
    database: sharelatex
    roles:
      - dbOwner
