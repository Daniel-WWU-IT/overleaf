apiVersion: v1
kind: Service
metadata:
    name: {{ include "overleafv6.fullname" . }}-service
    namespace: {{ include "overleafv6.namespace" . }}
    labels: {{ include "overleafv6.labels" . | nindent 8 }}
spec:
    selector:
        {{ include "overleafv6.selectorLabels" . | nindent 8 }}
    ports:
        -   port: 8099
            targetPort: 80
