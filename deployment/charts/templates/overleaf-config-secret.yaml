apiVersion: v1
kind: Secret
metadata:
    name: {{ include "overleafv6.fullname" . }}-config-secret
    namespace: {{ include "overleafv6.namespace" . }}
    labels: {{ include "overleafv6.labels" . | nindent 8 }}
type: Opaque
stringData:
    # The globally used API key; must be provided manually
    REMOTE_API_KEY: {{ required "An API key must be provided" .Values.network.apiKey | quote }}

    # These secrets are used only internally and don't need to be "knowable"
    OVERLEAF_SESSION_SECRET: {{ randAlphaNum 64 | quote }}
    OVERLEAF_INVITE_TOKEN_SECRET: {{ randAlphaNum 64 | quote }}
